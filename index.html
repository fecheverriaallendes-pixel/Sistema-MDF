    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        .thermal-num {
            font-family: Arial, Helvetica, 'Inter', sans-serif !important;
            font-variant-numeric: normal tabular-nums !important;
            font-feature-settings: "zero" 0, "tnum" 1 !important;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-gradient {
            background: linear-gradient(-45deg, #10b981, #3b82f6, #6366f1, #0f172a);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        /* Custom Scrollbar */

        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('ServiceWorker registrado:', reg.scope))
            .catch((err) => console.error('Error ServiceWorker:', err));
        });
